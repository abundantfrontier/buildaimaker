name: CI

on:
  push:
    branches: [main, "execute-plan/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Swift build & test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build packages and app target
        run: swift build

      - name: Test packages
        run: swift test

  # Documented path for a full app bundle build once an .xcodeproj is added.
  # Packages compile via `swift build` above without codesign secrets.
  # To open the project locally: open Package.swift in Xcode, select the
  # BuildAIMaker scheme, and Run (⌘R).
